import os
import re
from collections import Counter

print("=" * 55)
print("       CAMPUS LOST AND FOUND")
print("       L5.2 - SONARQUBE CODE REVIEW")
print("=" * 55)

filename = "app.js"

if not os.path.exists(filename):
    print("\nERROR: app.js file not found!")
    print("Keep this Python file in the project folder.")
    exit()

with open(filename, "r", encoding="utf-8") as file:
    code = file.read()

lines = code.splitlines()

print("\n1. DUPLICATED CODE CHECK")
print("-" * 55)

line_counts = Counter(
    line.strip() for line in lines
    if len(line.strip()) > 15
    and not line.strip().startswith(("//", "/*", "*"))
)

duplicates = [
    line for line, count in line_counts.items()
    if count > 1
]

if duplicates:
    print("Possible duplicated code found:")
    for line in duplicates:
        print("  ", line)
else:
    print("No obvious duplicated lines found.")

print("\nSuggested Fix:")
print("Create reusable functions to avoid repeated code.")

print("\n2. UNUSED VARIABLE CHECK")
print("-" * 55)

variable_pattern = r"\b(?:let|const|var)\s+([A-Za-z_$][\w$]*)"
variables = re.findall(variable_pattern, code)

unused = []

for variable in variables:
    occurrences = len(re.findall(
        r"\b" + re.escape(variable) + r"\b", code
    ))

    if occurrences == 1:
        unused.append(variable)

if unused:
    print("Possible unused variables:")
    for variable in unused:
        print("  ", variable)
else:
    print("No obvious unused variables found.")

print("\nSuggested Fix:")
print("Remove unused variables or use them meaningfully.")

print("\n3. HARDCODED CREDENTIAL CHECK")
print("-" * 55)

secret_pattern = (
    r"""(?i)\b(?:api_key|password|secret|token)\b"""
    r"""\s*[:=]\s*["'][^"']+["']"""
)

secrets = re.findall(secret_pattern, code)

if secrets:
    print("Possible hard-coded credentials found:")
    for secret in secrets:
        print("  ", secret)
else:
    print("No obvious hard-coded credentials found.")

print("\nSuggested Fix:")
print("Store sensitive credentials in environment variables.")
print("Never expose passwords or API keys in source code.")

print("\n" + "=" * 55)
print("           CODE REVIEW COMPLETED")
print("=" * 55)

print("\nNOTE:")
print("This is a basic Python code-review script.")
print("It is not an actual SonarQube scanner.")
print("Verify findings using SonarQube before submission.")